name: Deploy

# Vercel deploys CMS and storefront by itself on every push to main (Git integration).
# The storefront build reads the API (failOnBuild), so when a commit also changes the backend
# this workflow rebuilds both after the new backend is live:
# CI green → Render deploys the backend (autoDeployTrigger: checksPass) → wait until that deploy
# is live and the API answers → Vercel deploy hooks: CMS, then storefront.
# Don't turn off Vercel Git deploys of main (git.deploymentEnabled): it blocks deploy hooks too.
# A manual run (workflow_dispatch) always triggers the hooks.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  RENDER_SERVICE_ID: srv-dbqjqntbedkc73drfq40
  API_HEALTH_URL: https://gankaforhome-api.onrender.com/api/server/live

jobs:
  deploy:
    if:
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for the Render backend deploy
        id: render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # A commit that doesn't touch the backend (render.yaml buildFilter) gets no deploy.
          for i in $(seq 1 120); do
            status=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=20" \
              | jq -r --arg sha "$SHA" '[.[].deploy | select(.commit.id == $sha)][0].status // "none"')
            echo "Render deploy of $SHA: $status"
            case "$status" in
              live|deactivated) echo "rebuild=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled) exit 1 ;;
              none)
                if [ "$i" -ge 18 ]; then
                  echo "No backend deploy for this commit; Vercel's own Git deploy is enough"
                  echo "rebuild=$MANUAL" >> "$GITHUB_OUTPUT"; exit 0
                fi ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Render"; exit 1

      - name: Wake up the API
        if: steps.render.outputs.rebuild == 'true'
        # Render free spins down when idle; the first request can take about a minute.
        run:
          curl -fsS --retry 10 --retry-delay 10 --retry-all-errors --max-time 90
          "$API_HEALTH_URL"

      - name: Deploy CMS
        if: steps.render.outputs.rebuild == 'true'
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_CMS }}"

      - name: Deploy storefront
        if: steps.render.outputs.rebuild == 'true'
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_FRONTEND }}"
