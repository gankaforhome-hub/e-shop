name: Deploy

# Order: CI green → Render deploys the backend (autoDeployTrigger: checksPass) → wait until that
# deploy is live and the API answers → Vercel deploy hooks: CMS, then storefront. The storefront
# build reads the API (failOnBuild), so it must run against the new backend.
# Vercel Git deploys of `main` are off (frontend/vercel.json, cms/vercel.json); PR previews stay on.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  RENDER_SERVICE_ID: srv-dbqjqntbedkc73drfq40
  API_HEALTH_URL: https://gankaforhome-api.onrender.com/api/server/live

jobs:
  deploy:
    if:
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for the Render backend deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # A commit that doesn't touch the backend (render.yaml buildFilter) gets no deploy.
          for i in $(seq 1 120); do
            status=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=20" \
              | jq -r --arg sha "$SHA" '[.[].deploy | select(.commit.id == $sha)][0].status // "none"')
            echo "Render deploy of $SHA: $status"
            case "$status" in
              live|deactivated) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled) exit 1 ;;
              none) [ "$i" -ge 18 ] && { echo "No backend deploy for this commit"; exit 0; } ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Render"; exit 1

      - name: Wake up the API
        # Render free spins down when idle; the first request can take about a minute.
        run:
          curl -fsS --retry 10 --retry-delay 10 --retry-all-errors --max-time 90
          "$API_HEALTH_URL"

      - name: Deploy CMS
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_CMS }}"

      - name: Deploy storefront
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_FRONTEND }}"
