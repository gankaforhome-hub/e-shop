name: Keep API awake

# Render free spins the backend down after 15 idle minutes. A ping every 10 minutes keeps it up
# for demos (one service fits the 750 free hours a month). GitHub may delay scheduled runs.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run:
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors --max-time 90
          https://gankaforhome-api.onrender.com/api/server/live
