name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec prettier --check frontend cms .github
      - run: pnpm flint
      - run: pnpm clint
      # Non-blocking until the existing backend lint errors are fixed (see AGENTS.md §17).
      - run: pnpm --filter backend lint:ci
        continue-on-error: true

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm check-types

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter backend exec prisma validate
      # Every migration must apply to an empty database.
      - run: pnpm --filter backend prisma:deploy
      - run: pnpm bbuild

  cms:
    runs-on: ubuntu-latest
    env:
      # The CMS build doesn't call the API; the values only satisfy the config.
      API_URL: http://127.0.0.1:3001/api
      CMS_URL: http://localhost:3030
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm cbuild

  # The frontend build needs a live API (failOnBuild), so it's checked by the
  # Vercel Preview deployment of each PR until the Docker stage adds it here.
