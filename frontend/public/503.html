<!doctype html>
<!--
  Maintenance page for the reverse proxy (served with 503 + Retry-After when
  the backend or Next itself is down). Plain HTML, no Next runtime: the proxy
  serves it and the two images below straight from `frontend/public/`.
  Texts mirror `common.serverError` in `dictionaries/{uk,en}/common.json`.
-->
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Сервіс тимчасово недоступний | Ganka for Home</title>
    <style>
      :root {
        --background: #ffffff;
        --foreground: #4a5565;
        --foreground-emphasis: #22252a;
        --muted: #f4f5f7;
        --primary: #b11226;
        --primary-hover: #8e0e1e;
        --ring: #b11226;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--background);
        color: var(--foreground);
        font-family:
          'Noto Sans',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header {
        display: flex;
        justify-content: center;
        padding: 20px 16px;
        border-bottom: 1px solid var(--muted);
      }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--foreground-emphasis);
        text-decoration: none;
      }
      .logo svg {
        display: block;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(32px, 6vw, 64px);
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
        padding: clamp(24px, 6vw, 120px) 16px;
      }
      main img {
        display: block;
        width: 100%;
        max-width: 560px;
        height: auto;
      }
      .copy {
        max-width: 32rem;
      }
      .code {
        margin: 0 0 clamp(8px, 1vw, 16px);
        font-size: clamp(12px, 1.2vw, 16px);
        line-height: 2;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 clamp(8px, 1vw, 16px);
        color: var(--foreground-emphasis);
        font-size: clamp(24px, 2.4vw, 32px);
        font-weight: 500;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      .description {
        margin: 0 0 clamp(32px, 4vw, 64px);
        font-size: clamp(16px, 1.6vw, 24px);
        line-height: 1.4;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 150px;
        padding: 12px 24px;
        border: 1px solid var(--primary);
        border-radius: 8px;
        background: var(--primary);
        color: #ffffff;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          border-color 0.2s ease;
      }
      .button:hover {
        border-color: var(--primary-hover);
        background: var(--primary-hover);
      }
      .button-outline {
        background: var(--background);
        color: var(--primary);
      }
      .button-outline:hover {
        background: var(--background);
      }
      .button:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      @media (min-width: 1024px) {
        main {
          flex-direction: row-reverse;
          justify-content: space-between;
        }
        main img {
          max-width: 66%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="logo" href="/" data-home aria-label="Ganka for Home">
        <svg width="32" height="32" aria-hidden="true">
          <use href="/images/logo-sprite.svg#ganka-logo-mark"></use>
        </svg>
        <svg width="216" height="18" aria-hidden="true">
          <use href="/images/logo-sprite.svg#ganka-logo-text"></use>
        </svg>
      </a>
    </header>
    <main>
      <img
        src="/images/server-error.webp"
        width="827"
        height="620"
        alt="Равлик із номером помилки 503"
        data-text="imageAlt"
      />
      <div class="copy">
        <p class="code" data-text="textError">Помилка 503</p>
        <h1 data-text="pageTitle">Сервіс тимчасово недоступний</h1>
        <p class="description" data-text="description">
          Ми вже працюємо над цим. Спробуйте ще раз або поверніться за кілька
          хвилин.
        </p>
        <div class="actions">
          <button
            class="button"
            type="button"
            data-text="retryLabel"
            onclick="location.reload()"
          >
            Спробувати ще раз
          </button>
          <a
            class="button button-outline"
            href="/"
            data-home
            data-text="buttonText"
            aria-label="Повернутися на головну сторінку"
            >На головну</a
          >
        </div>
      </div>
    </main>
    <script>
      // Locale from the first path segment, as on the site (`uk` has no prefix)
      (function () {
        if (location.pathname.split('/')[1] !== 'en') return;
        var en = {
          imageAlt: 'Snail with error number 503',
          textError: 'Error 503',
          pageTitle: 'Service temporarily unavailable',
          description:
            'We are already working on it. Please try again or come back in a few minutes.',
          retryLabel: 'Try again',
          buttonText: 'Back home',
        };
        document.documentElement.lang = 'en';
        document.title = en.pageTitle + ' | Ganka for Home';
        document.querySelectorAll('[data-text]').forEach(function (node) {
          var value = en[node.getAttribute('data-text')];
          if (node.tagName === 'IMG') node.alt = value;
          else node.textContent = value;
        });
        document.querySelectorAll('[data-home]').forEach(function (link) {
          link.href = '/en';
        });
        document
          .querySelector('[data-home].button')
          .setAttribute('aria-label', 'Go back to the home page');
      })();
    </script>
  </body>
</html>
